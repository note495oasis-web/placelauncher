name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL repository variable is not set; skipping."
            exit 0
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 60 "${{ vars.BACKEND_URL }}/health"; then
              echo "Backend is awake."
              exit 0
            fi
            echo "Attempt $i failed (cold start?), retrying in 20s..."
            sleep 20
          done
          echo "Backend did not respond after retries."
          exit 1