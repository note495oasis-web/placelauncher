appId: com.placelauncher.launcher
productName: PlaceLauncher
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - nsis-web
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: PlaceLauncher
nsisWeb:
  artifactName: ${name}-${version}-web-setup.${ext}
publish:
  provider: github
  owner: note495oasis-web
  repo: placelauncher