services:
  - type: web
    name: aurora-friends
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: UPLOADS_PER_WEEK
        value: "5"
      - key: IMPORTS_PER_WEEK
        value: "20"